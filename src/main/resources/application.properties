spring.application.name=bank-management-system
#server port
server.port=8080
# Dynamic MySQL Database Connection (Reads from Render Environment Variables)
spring.datasource.url=jdbc:mysql://${localhost}:${3306}/${bank_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${root}
spring.datasource.password=${p@sql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
