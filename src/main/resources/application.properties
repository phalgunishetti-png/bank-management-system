spring.application.name=bank-management-system
# Server Port
server.port=8080

# MySQL Database Connection (Ensure 'bank_db' exists in MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=p@sql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect